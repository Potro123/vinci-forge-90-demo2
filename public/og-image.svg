<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(59, 130, 246);stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:rgb(147, 51, 234);stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <!-- Lightning bolt icon -->
  <g transform="translate(500, 180)">
    <path d="M120 0L80 100L140 100L100 200L180 80L120 80L160 0Z" fill="#3b82f6"/>
    <path d="M120 0L80 100L140 100L100 200L180 80L120 80L160 0Z" fill="url(#lightning-grad)" opacity="0.6"/>
    <defs>
      <linearGradient id="lightning-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
      </linearGradient>
    </defs>
  </g>
  
  <!-- Title -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    VinciAI
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">
    Create Stunning 3D Models with AI
  </text>
  
  <!-- Tagline -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="24" fill="#64748b" text-anchor="middle">
    Transform text and images into 3D models in seconds
  </text>
</svg>
